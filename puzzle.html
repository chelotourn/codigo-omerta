<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I.Q. Puzzle: El Rey a Caido v0.82</title>
<style>
:root{color-scheme:light;--bg:#eceae4;--panel:#f7f6f2;--ink:#1c1c1c;--paper:#fff;--text:#222;--muted:#666;--accent:#2a6fdb;--bad:#d93025;--ok:#1e8e3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16171a;--panel:#26282d;--text:#e8e8e8;--muted:#9a9a9a;--accent:#6ea2f5}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16171a;--panel:#26282d;--text:#e8e8e8;--muted:#9a9a9a;--accent:#6ea2f5}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 10px 28px}
h1{font-size:1.3rem;margin:4px 0 2px}
.sub{margin:0 0 12px;color:var(--muted);font-size:.9rem;text-align:center;max-width:520px}
.hint{font-style:italic;color:var(--accent)}
#tip:empty{display:none}
#tip{max-width:600px;text-wrap:balance;line-height:1.45}
.dg{display:inline-grid;grid-template-columns:repeat(3,1.7em);gap:3px;margin:6px 0;font-style:normal}
.dg i{font-style:normal;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--paper);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.dg i.n{box-shadow:inset 0 0 0 2px var(--accent)}
.dg i.o{background:transparent;box-shadow:none;border:2px dashed var(--muted)}
.dg i.ar{color:#8c8c8c;font-weight:400;font-size:1.1em}
.dg i svg{width:78%;height:78%}
.sq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px;margin:6px 0}
.sq b{font-style:normal;font-weight:400}
.sq .dg{margin:0}
.wrap{width:min(100%,640px);display:flex;flex-direction:column;align-items:center}
.card{width:100%;background:var(--panel);border-radius:12px;padding:12px 14px;margin:0 0 10px;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.card h2{margin:0;font-size:1.05rem;display:flex;gap:10px;align-items:center}
.card h2 b{font-size:1.7rem;font-weight:400;width:1.6rem;text-align:center}
.card p{margin:2px 0 8px;font-size:.85rem;color:var(--muted)}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.lv button{padding:8px 10px;font-size:.9rem;line-height:1.25;text-align:center}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--muted);background:var(--panel);color:var(--text);cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#fff}
button.done{border-color:var(--ok)}
button:disabled{opacity:.45;cursor:default}
#gt{margin:0;font-size:1.1rem;text-align:center}
#board{position:relative;width:100%;max-width:560px;background:var(--panel);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden}
.tile{position:absolute;padding:.6%;transition:left .13s,top .13s;cursor:pointer}
.tile>div{width:100%;height:100%;background:var(--paper);border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tile svg{width:100%;height:100%;display:block}
.tile.bad1>div{box-shadow:inset 0 0 0 3px #e6b800}
.tile.bad2>div{box-shadow:inset 0 0 0 4px #ef7d00}
.tile.bad3>div{box-shadow:inset 0 0 0 5px var(--bad)}
.tile.sm{padding:.25%}
.tile.sm>div{border-radius:4px}
.tile.sm.bad1>div{box-shadow:inset 0 0 0 2px #e6b800}
.tile.sm.bad2>div{box-shadow:inset 0 0 0 3px #ef7d00}
.tile.sm.bad3>div{box-shadow:inset 0 0 0 4px var(--bad)}
.tile>div.t7{background:#d6e6ff}.tile>div.t8{background:#d9f2d6}.tile>div.t9{background:#e8dcff}.tile>div.t10{background:#fff0c2}
#egg{position:absolute;inset:0;pointer-events:none}
#egg .et{position:absolute;bottom:16px;background:var(--paper);border-radius:4px;padding:2px;cursor:pointer;pointer-events:auto;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .7s}
#egg .et svg{width:100%;height:100%;display:block}
#egg .jt{position:absolute;color:#fff;font-weight:700;white-space:nowrap;pointer-events:none;animation:jaup 1.5s ease-out forwards}
@keyframes jaup{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px)}}
#egg .jt.L{animation:jaupL var(--t) ease-out forwards}
@keyframes jaupL{0%{opacity:0;transform:translate(-50%,8px)}10%{opacity:1}70%{opacity:1;transform:translate(-50%,-48px)}100%{opacity:0;transform:translate(-50%,-70px)}}
#eexit{position:absolute;left:0;right:0;top:calc(50% + 4.6rem);text-align:center;color:#fff;opacity:0;font-size:.95rem;letter-spacing:.08em;cursor:pointer;padding:12px;transition:opacity 1.2s;pointer-events:none}
#eexit.on{opacity:.6;pointer-events:auto}
#red{position:absolute;inset:0;background:#7a0000;opacity:0;pointer-events:none;transition:opacity 2.4s}
#red.on{opacity:1}
.tile.good>div{box-shadow:inset 0 0 0 3px var(--ok)}
#hole{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none}
#hole i{width:40%;aspect-ratio:1;border-radius:50%;border:2px dashed var(--muted);opacity:.6}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;margin:12px 0}
label{font-size:.9rem;display:flex;gap:6px;align-items:center}
#status{min-height:1.5em;font-weight:600;text-align:center}
#status.ok{color:var(--ok)}
#refbox{max-width:560px;display:flex;flex-direction:column;align-items:center}
#ref{display:grid;gap:3px}
.rc{aspect-ratio:1;background:var(--paper);border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.rc svg{width:100%;height:100%;display:block}
.tile.gone svg{opacity:0;transition:opacity .6s}
#fall{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#000;color:#fff;font-family:Georgia,serif;font-size:clamp(1.6rem,6vw,2.6rem);letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:50}
#fall.on{opacity:1;pointer-events:auto}
#fall{overflow:hidden;flex-direction:column;transition:opacity 1.2s,background 1.6s}
#fall.black{background:#000}
#fall.slow{transition:opacity 1.8s,background 1.6s}
#ask{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:40;padding:20px}
#ask .box{background:var(--panel);color:var(--text);border-radius:12px;padding:16px 18px;max-width:340px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#ask p{margin:0 0 14px;line-height:1.4}
#fc{transition:opacity 1.2s}
#fall.black #fc{opacity:0}
#fallt{line-height:1.3}
#fin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:.5em;font-size:clamp(2rem,9vw,3.6rem);letter-spacing:.5em;opacity:0;transition:opacity 1.4s;pointer-events:none}
#fall.black #fin{opacity:1;transition-delay:.9s}
.srow{display:flex;justify-content:center;gap:.15em;font-size:clamp(1.6rem,7vw,2.6rem);line-height:1.15;margin-top:14px}
.srow span{display:inline-block;opacity:0}
.pc.l{transform:translateX(-110vw)}
.pc.r{transform:translateX(110vw)}
.pc.in{opacity:1;transform:none;transition:transform 1.8s cubic-bezier(.2,.7,.2,1),opacity .8s}
.pw{transform:scale(.3)}
.pw.in{opacity:1;transform:none;transition:transform .35s,opacity .35s}
#fall.chap{transition:opacity 1.8s,background 1.6s}
#fall.chap.on{transition:opacity 2.8s,background 1.6s}
#fall.chap #fallt{font-size:clamp(1.15rem,4.4vw,1.8rem);max-width:30em;line-height:1.5}
#fall.chap::after{content:"Toca para continuar";position:absolute;bottom:7%;left:0;right:0;font-size:.85rem;letter-spacing:.08em;opacity:0;animation:fh 1.2s 3.5s forwards}
@keyframes fh{to{opacity:.55}}
#fall.hang #fc{opacity:0}
#fall.hang #fin{inset:auto;left:0;right:0;top:46%;height:auto}
#fall.hang #eexit{top:auto;bottom:4%}
#fall.endf #fin{opacity:1;transition-delay:.4s}
#fall.redbg{background:#4d0000}
#hang{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#hang .hr{position:absolute;left:0;right:0;margin-top:0}
#hang .plat{position:absolute;height:4px;background:#fff;border-radius:2px;transform:scaleX(0);transform-origin:left center;transition:transform 1.4s ease-out}
#hang .plat.in{transform:none}
#hang .beam{position:absolute;height:2px;background:#fff;border-radius:1px;transform:scaleX(0);transform-origin:center;transition:transform 1.2s ease-out}
#hang .beam.in{transform:none}
#hang .plat.gone{opacity:0;transform:translateY(12px);transition:opacity .15s,transform .15s}
#hang .hg{position:absolute;top:0;height:0;transform-origin:50% 0}
#hang .rope{position:absolute;left:50%;top:0;width:2px;margin-left:-1px;height:0;background:#fff;transition:height 1.3s ease-out}
#hang .hc{position:absolute;left:0;background:var(--paper);border-radius:4px;padding:3px;transition:top .18s ease-in}
#hang .hc svg{width:100%;height:100%;display:block}
#hang .hg.sw{animation:swing var(--d) ease-in-out var(--w) infinite alternate}
@keyframes swing{from{transform:rotate(calc(var(--a) * -1))}to{transform:rotate(var(--a))}}
</style>
</head>
<body>
<h1 id="ttl">El Rey ha caído</h1>
<p class="sub" id="top">Las noticias de la captura del rey llegan al reino, que se prepara para la guerra.<br>Un viaje de cinco pruebas hasta la batalla final.</p>
<div id="map" class="wrap"></div>
<!-- TEMP-DEV: borrar este bloque, sus 3 líneas de JS (devi/devo/devu), el "devAll" en unlocked y los 2 "dev" en load/showMap -->
<div id="dev" class="bar" style="margin:18px 0 0;opacity:.8"><button id="devi" style="border-style:dashed">▶ Ver intro</button><button id="devo" hidden style="border-style:dashed">▶ Ver final</button><button id="devc" hidden style="border-style:dashed">▶ Ver Ocaso</button><button id="devu" hidden style="border-style:dashed">🔓 Desbloquear todo</button></div>
<div id="game" class="wrap" hidden>
  <h2 id="gt"></h2>
  <div id="refbox" class="card" hidden><div class="sub" id="reft" style="margin:0 0 6px"></div><div id="ref"></div><p class="sub" id="gd2" style="margin:10px 0 0"></p></div>
  <p class="sub" id="gd" style="margin:8px 0 6px"></p>

  <div id="board"><div id="hole"><i></i></div></div>
  <div class="bar">
    <button class="main" id="shuf">Reorganizar tropas</button>
    <button id="un">Retirada</button>
    <button id="ex">Ver ejemplo</button>
    <button id="mp">Mapa</button>
    
    <label><select id="conf"><option value="t">Vigilar todo</option><option value="c">Vigilar caminos</option><option value="d">Vigilar diagonales</option></select></label>
  </div>
  <div id="status"></div>
  <div class="sub" id="moves"></div>
  <p class="sub" id="chap" hidden style="font-style:italic;color:var(--text);margin:8px 0 12px"></p>
  <button class="main" id="nx" hidden>Siguiente desafío ▸</button>
  
</div>
<div id="fall"><div id="fc"><div id="fallc" style="font-size:3.2rem;margin-bottom:8px">&#9818;&#xFE0E;</div><div id="fallt">El Rey ha caído</div><div id="scene"><div id="krow" class="srow"></div><div id="prow" class="srow"></div><div id="wrow" class="srow"></div><div id="w2row" class="srow"></div></div></div><div id="hang"></div><div id="fin">FIN</div><div id="egg"></div><div id="eexit">Pulsa para salir</div><div id="red"></div></div>
<div id="ask" hidden><div class="box"><p id="askt"></p><div class="bar" style="margin:0"><button id="askn">Cancelar</button><button class="main" id="asky">Continuar</button></div></div></div>
<script>
const $=i=>document.getElementById(i),INK="var(--ink)",PA="var(--paper)";
const sh=[
`<path d="M36 12h28v24h24v28H64v24H36V64H12V36h24z" fill="${INK}"/>`,
`<rect x="12" y="12" width="76" height="76" fill="${INK}"/>`,
`<polygon points="50,14 88,84 12,84" fill="none" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>`,
`<polygon points="14,12 14,88 88,88" fill="${INK}"/>`,
`<rect x="10" y="10" width="80" height="80" fill="${INK}"/><circle cx="50" cy="50" r="32" fill="${PA}"/>`,
`<polygon points="10,16 90,16 50,86" fill="${INK}"/>`,
`<rect x="10" y="10" width="80" height="80" fill="${INK}"/><polygon points="50,18 82,50 50,82 18,50" fill="${PA}"/>`,
`<circle cx="50" cy="26" r="13" fill="${INK}"/><path d="M40 42h20l10 32H30z" fill="${INK}"/><rect x="22" y="74" width="56" height="13" rx="3" fill="${INK}"/>`,
`<path d="M22 12h13v11h8V12h14v11h8V12h13v32H22z" fill="${INK}"/><path d="M32 44h36l5 30H27z" fill="${INK}"/><rect x="20" y="74" width="60" height="13" rx="3" fill="${INK}"/>`,
`<circle cx="50" cy="11" r="6" fill="${INK}"/><ellipse cx="50" cy="38" rx="16" ry="24" fill="${INK}"/><path d="M44 26l14 14" stroke="${PA}" stroke-width="4"/><path d="M38 58h24l9 16H29z" fill="${INK}"/><rect x="22" y="74" width="56" height="13" rx="3" fill="${INK}"/>`,
`<path d="M24 87V77c0-18 12-24 18-36L30 42 18 50l-4-8 22-26 8 4 6-10 6 14c14 6 22 22 20 44v17z" fill="${INK}"/><circle cx="50" cy="32" r="3" fill="${PA}"/>`];
const sym=s=>typeof s==="number"?sh[s]:`<text x="50" y="72" text-anchor="middle" font-size="64" font-weight="700" fill="${INK}">${s}</text>`;
const svg=s=>`<svg viewBox="0 0 100 100">${sym(s)}</svg>`;
const rg=(n,f)=>Array.from({length:n},(_,k)=>f(k));
const P=(n,f)=>rg(n,r=>rg(n,c=>f(r,c)));
const AB={A:3,B:0,C:5};
const dg=rows=>`<span class="dg" style="grid-template-columns:repeat(${rows[0].length},1.5em)">`+rows.map(w=>(Array.isArray(w)?w:[...w]).map(ch=>ch=='x'?'<i></i>':ch=='o'?'<i class="o"></i>':ch=='v'?'<i class="ar">↓</i>':ch=='>'?'<i class="ar">→</i>':ch=='^'?'<i class="ar">↑</i>':ch=='<'?'<i class="ar">←</i>':AB[ch]!==undefined?'<i>'+svg(AB[ch])+'</i>':'<i class="n">'+ch+'</i>').join('')).join('')+'</span>';
const seq=a=>'<span class="sq">'+a.map(r=>dg(r)).join('<b>→</b>')+'</span>';
const ROW1=[0,5,6,2,4,1,3];
const RN=P(5,(r,c)=>[4,2,5,0,6][(c+2*r)%5]);
const cyc=F=>P(4,(r,c)=>F[(r+c)%4]),TO2=cyc([6,5,2,0]),TO3=cyc([0,2,4,5]);
const B={pa:[[5,6,5],[6,5,6],[5,6,5]],pb:[[5,6,1],[1,5,6],[6,1,5]],pc:[["1","2","3"],["4","5","6"],["7","8","9"]],
 to:P(4,(r,c)=>ROW1[(r+c)%4]),
 al:[[0,1,2,3],[2,3,0,1],[3,2,1,0],[1,0,3,2]].map(w=>w.map(i=>ROW1[i])),
 re:P(5,(r,c)=>ROW1[(3*r+c)%5]),fi:P(7,(r,c)=>ROW1[(3*r+c)%7])};
const ON=[0,5,6,2,4,1,3,7,8,9,10];B.on=P(11,(r,c)=>ON[(c+2*r)%11]);
const ALT={to:P(4,(r,c)=>ROW1[(r+[1,2,0,3][c])%4]),al:[[3,2,0,1],[1,0,2,3],[2,3,1,0],[0,1,3,2]].map(w=>w.map(i=>ROW1[i]))};
const PC=[["♟\uFE0E","Peón","Humildes labores en el reino: aprende a deslizar y a copiar un patrón."],
["♜\uFE0E","Torre","La torre vigila al enemigo: cada forma una sola vez por fila y por columna."],
["♝\uFE0E","Alfil","Los infiltrados llegan por las diagonales: ahora también cuentan."],
["♛\uFE0E","Reina","La reina rehace su corte y envía a los caballeros en busca del rey: todas las reglas, en un tablero mayor."],
["♞\uFE0E","Caballeros","El rey sigue cautivo y solo sus caballeros conocen el camino que lo libera."],
["♚︎","El desafío del Rey","La batalla final ha llegado. El reino cuenta contigo."],
["☠\uFE0E","El Ocaso","Los remanentes de la conspiración lanzan un último ataque desesperado en la corte del rey, infiltrados con la voluntad de quemar el reino. ¡Deténlos!"]];
const L=[],Z=(p,t,d,o)=>L.push({p,t,d,...o});
Z(0,"Trabajo humilde","Copia las dos primeras filas del patrón.",{n:3,base:B.pa,copy:1,cr:2,extra:1,shuf:14,tip:"Toca una ficha para deslizarla al hueco; la fila de abajo queda libre. Empieza por la fila de arriba. El hueco es tu herramienta."});
Z(0,"Preparando la cosecha","El mismo juego con tres formas: copia las dos primeras filas.",{n:3,base:B.pb,copy:1,cr:2,extra:1,shuf:24,tip:"Si te atascas, usa Retirada."});
Z(0,"El acantonamiento","Ordena del 1 al 9, fila a fila: primero la de arriba.",{n:3,base:B.pc,copy:1,extra:1,shuf:36,tip:"<b>Clave para el resto del juego</b><br>Para colocar el 2 y el 3: pon el 2 en el lugar del 3 y el 3 en el lugar del 9, dejando el hueco entre ambos. Sube entonces el 3 y desplaza los dos «en tren» hasta su lugar.<br>"+seq([["12x","xxx","xxx"],["1x2","xxo","xx3"]])+"<br>Para colocar el 4 y el 7: forma el 74 en la fila del 4 y desplázalo hasta su lugar.<br>"+seq([["123","xx4","xxx"],["123","7o4","xxx"]])+"<br>Las últimas fichas se ordenan girando tres de ellas alrededor del hueco.<br>Esto sirve en todos los tamaños para resolver la última fila y la última columna. Si te atascas, usa Retirada."});
[["Vigilando al enemigo","full",40],["Misión de Exploración","row",60],["Conspiración revelada","close",80]].forEach(([t,ref,s],i)=>Z(1,t,i==0?"Copia el patrón: cada forma una sola vez por fila y por columna.":"Cada forma una sola vez por fila y por columna.",{n:4,base:[B.to,TO2,TO3][i],extra:1,copy:i==0?1:0,gen:i==0?1:0,show:ref=="row"?[[2,3]]:0,ref,shuf:s,tip:ref=="close"?"Tenemos que cortar el avance enemigo por las diagonales.":ref=="row"?"Adéntrate en las tierras del reino y vigila los movimientos del enemigo, utiliza la «Vigilancia» de la torre para detectar conflictos (vertical y horizontal), amarillo para uno y naranja para ambos. Puede que descubras nuevos peligros más adelante.":""}));

 const t1=3800,tB=t1+1700,tC=tB+900+1900,tD=tC+PAWNS*130+500,t3=tD+PAWNS*130+1700,t4=t3+5000;
 at(0,()=>{$("fallc").style.display="none";$("fallt").innerHTML='<span>El Rey ha regresado</span><span style="display:block;margin-top:1.3em">La guerra ha acabado</span>';buildScene();F.classList.remove("slow");F.classList.add("on")});
 at(t1,()=>$("krow").querySelectorAll("span").forEach(e=>e.classList.add("in")));
 at(tB,()=>{const s=$("prow").querySelectorAll("span");[0,1,2].forEach(p=>setTimeout(()=>{s[p].classList.add("in");s[5-p].classList.add("in")},p*450))});
 const pw=id=>()=>$(id).querySelectorAll("span").forEach((e,k)=>setTimeout(()=>e.classList.add("in"),k*130));
 at(tC,pw("wrow"));at(tD,pw("w2row"));
 at(t3,()=>F.classList.add("black"));
 at(t3+2800,startEgg)}
function endOutro(){if(!outroing)return;outroing=false;const F=$("fall");F.classList.remove("on","black");busy=false;showMap();
 setTimeout(()=>{if(!F.classList.contains("on")){$("scene").querySelectorAll(".srow").forEach(e=>e.innerHTML="");$("fallt").textContent="El Rey ha caído";$("fallc").style.display=""}},1500)}
const HG={on:false};
function buildHang(){const W=innerWidth,H=innerHeight,N=7,sz=Math.round(Math.max(26,Math.min(38,W*.9/N-12))),sp=Math.max(sz+8,Math.min(54,W*.92/N)),
 x0=(W-N*sp)/2,pl=Math.round(H*.36),by=Math.round(H*.14),yt=pl-sz-by;
 const row=y=>`<div class="srow hr" style="top:${y}px">${rg(PAWNS,()=>'<span class="pw">♟&#xFE0E;</span>').join("")}</div>`;
 $("hang").innerHTML=row(Math.round(H*.72))+row(Math.round(H*.82))
  +`<div class="plat" style="left:${x0-sp*.5}px;width:${(N+1)*sp}px;top:${pl}px"></div>`
  +`<div class="beam" style="left:${x0-sp*.5}px;width:${(N+1)*sp}px;top:${by}px"></div>`
  +EGG_SH.map((s,k)=>`<div class="hg" style="top:${by}px;left:${x0+k*sp+(sp-sz)/2}px;width:${sz}px;transform:translateX(110vw);--d:${(2.2+Math.random()*1.4).toFixed(2)}s;--a:${(2.5+Math.random()*2).toFixed(1)}deg;--w:-${(Math.random()*3).toFixed(2)}s"><div class="rope"></div><div class="hc" style="top:${yt}px;width:${sz}px;height:${sz}px">${svg(s)}</div></div>`).join("");
 return yt}
function ocaso(){outroing=true;busy=true;const tok=++outroTok,F=$("fall"),B=$("hang"),en=[...new Set(syms)].filter(s=>typeof s==="number"&&s<7),t0=900,gap=650;
 en.forEach((s,k)=>setTimeout(()=>syms.forEach((x,j)=>{if(x===s)els[j].classList.add("gone")}),t0+k*gap));
 const tf=t0+en.length*gap+1400,at=(ms,f)=>setTimeout(()=>{if(outroing&&tok===outroTok)f()},tf+ms);let yt=0;
 at(0,()=>{HG.on=true;$("fallc").style.display="none";$("fallt").textContent="";yt=buildHang();F.classList.add("hang","slow","on")});
 at(2600,()=>B.querySelectorAll(".hr").forEach((rw,i)=>rw.querySelectorAll("span").forEach((e,k)=>setTimeout(()=>e.classList.add("in"),i*(PAWNS*130+300)+k*130))));
 at(5200,()=>B.querySelector(".plat").classList.add("in"));
 at(6900,()=>B.querySelectorAll(".hg").forEach((h,i)=>setTimeout(()=>{h.style.transition="transform 4.6s linear";h.style.transform="none"},i*700)));
 at(16000,()=>{B.querySelector(".beam").classList.add("in");B.querySelectorAll(".rope").forEach((r,i)=>setTimeout(()=>{r.style.height=yt+"px"},1000+i*220))});
 at(20300,()=>{B.querySelector(".plat").classList.add("gone");
  B.querySelectorAll(".hg").forEach(h=>{const r=h.querySelector(".rope"),c=h.querySelector(".hc");r.style.transitionDuration=".18s";r.style.height=(yt+14)+"px";c.style.top=(yt+14)+"px";setTimeout(()=>h.classList.add("sw"),200)})});
 at(23600,()=>F.classList.add("redbg","endf"));
 at(27100,()=>$("eexit").classList.add("on"))}
function endHang(){if(!HG.on)return;HG.on=false;outroing=false;$("eexit").classList.remove("on");$("fall").classList.remove("on");busy=false;showMap();
 setTimeout(()=>{if(!$("fall").classList.contains("on"))resetFall()},2200)}
const EGG_SH=[0,5,6,2,4,1,3],EGG_END=["JA JA","JA JA JA","Esta vez","no escaparás","¡LEALES A MÍ!","¡ATACAD!","¡QUEMAD EL REINO!","¡NO DEJÉIS NADA!"];
const EG={on:false,lock:false,cur:0,cnt:0,tiles:[]};
const eggSize=()=>Math.max(20,Math.min(28,(innerWidth-28-6*6)/7));
function eggAdd(k){if(!EG.on)return;const sz=eggSize(),el=document.createElement("div");
 el.className="et";el.style.width=el.style.height=sz+"px";el.style.left=(14+k*(sz+6))+"px";
 el.innerHTML=svg(EGG_SH[k]);el.style.opacity=0;el.style.transform=k?"translateX(120vw)":"translateY(70px)";
 el.onclick=ev=>{ev.stopPropagation();eggTap(k)};
 $("egg").appendChild(el);EG.tiles[k]=el;el.getBoundingClientRect();el.style.opacity=1;el.style.transform="none"}
function eggSay(k,txt,ms){const sz=eggSize(),j=document.createElement("div"),long=k==6;ms=ms||(long?3400:1500);if(long)$("egg").querySelectorAll(".jt.L").forEach(o=>o.remove());j.className="jt"+(long?" L":"");j.style.setProperty("--t",ms+"ms");j.textContent=txt;
 j.style.fontSize=k==6?"1.5rem":"1.15rem";j.style.bottom=(16+sz+6)+"px";j.style.left="0px";$("egg").appendChild(j);
 const w=j.offsetWidth,cx=14+k*(sz+6)+sz/2;j.style.left=Math.max(w/2+8,Math.min(innerWidth-w/2-8,cx))+"px";
 setTimeout(()=>j.remove(),ms+100)}
function eggTap(k){if(!EG.on||EG.lock)return;
 if(k!==EG.cur){eggSay(k,"...");return}
 EG.cnt++;const need=k+2;
 if(k==6){eggSay(k,EGG_END[EG.cnt-1],EG.cnt>=need?4800:0);if(EG.cnt>=need)eggRed();return}
 if(EG.cnt<need){eggSay(k,"JA");return}
 eggSay(k,"JA JA");EG.cur=k+1;EG.cnt=0;setTimeout(()=>eggAdd(k+1),500)}
function startEgg(){EG.on=true;EG.lock=false;EG.cur=0;EG.cnt=0;EG.tiles=[];$("egg").innerHTML="";eggAdd(0);
 setTimeout(()=>{if(EG.on)$("eexit").classList.add("on")},1200)}
function eggClean(){EG.on=false;EG.lock=false;$("egg").innerHTML="";$("eexit").classList.remove("on")}
function resetFall(){const F=$("fall");F.classList.remove("black","chap","slow","hang","endf","redbg");$("hang").innerHTML="";$("red").classList.remove("on");
 $("scene").querySelectorAll(".srow").forEach(e=>e.innerHTML="");$("fallt").textContent="El Rey ha caído";$("fallc").innerHTML="&#9818;&#xFE0E;";$("fallc").style.display=""}
function eggRed(){EG.lock=true;$("eexit").classList.remove("on");
 setTimeout(()=>$("red").classList.add("on"),2800);
 setTimeout(()=>{eggClean();outroing=false;eggSeen=true;try{localStorage.setItem("iqegg","1")}catch(e){}
  load(SECRET);$("fall").classList.remove("on");setTimeout(resetFall,1600)},6000)}
$("eexit").onclick=e=>{e.stopPropagation();if(HG.on){endHang();return}if(!EG.on||EG.lock)return;eggClean();endOutro()};
$("fall").onclick=()=>{if(!$("fall").classList.contains("on")||EG.on||HG.on)return;if(chaptering){endChap();return}if(intro)endIntro();else endOutro()};
function ask(fn,msg){if(busy)return;if(moves<1||won){fn();return}
 $("askt").textContent=msg;const A=$("ask");A.hidden=false;
 $("asky").onclick=()=>{A.hidden=true;fn()};$("askn").onclick=()=>{A.hidden=true}}
$("shuf").onclick=()=>ask(shuffle,"Si reorganizas las tropas, perderás el progreso de este tablero. ¿Continuar?");
$("ex").onclick=()=>ask(()=>{if(busy)return;clearState();solved();moves=0;play=false;won=false;$("nx").hidden=true;refresh()},"Si ves el ejemplo, perderás el progreso de este tablero. ¿Continuar?");
$("mp").onclick=()=>ask(()=>go(showMap),"Si vuelves al mapa, perderás el progreso de este tablero. ¿Continuar?");

$("nx").onclick=()=>go(()=>cur+1<L.length?load(cur+1):showMap());
$("conf").onchange=refresh;

$("devu").onclick=()=>{devAll=true;showMap()};
board.addEventListener("click",e=>{const R=board.getBoundingClientRect(),c=Math.floor((e.clientX-R.left)/R.width*cols),r=Math.floor((e.clientY-R.top)/R.height*n),now=Date.now();
 if(intro&&cols>n&&r==n-1&&c==n){dbgTaps=now-dbgT<1500?dbgTaps+1:1;dbgT=now;if(dbgTaps>=7){dbgTaps=0;dbg=true;if(!busy){intro=false;showMap()}}}else dbgTaps=0});
$("devo").onclick=()=>{noShuf=true;load(FINAL);outro()};
$("devc").onclick=()=>{noShuf=true;load(SECRET);ocaso()};
$("un").onclick=()=>{if(busy||won||!hist.length)return;g=hist.pop();moves=Math.max(0,moves-1);refresh();saveState()};
let first;try{first=location.hash=="#intro"||(!localStorage.getItem("iqintro")&&!dn.some(Boolean))}catch(e){first=!dn.some(Boolean)}
let S0=null;try{S0=JSON.parse(localStorage.getItem("iqstate"))}catch(e){}
if(first)load(FINAL,true);else if(S0&&stateOK(S0)&&unlocked(S0.l)){RS=S0;load(S0.l)}else showMap();
