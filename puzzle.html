<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I.Q. Puzzle interactivo</title>
<style>
:root{color-scheme:light;--bg:#eceae4;--panel:#f7f6f2;--ink:#1c1c1c;--paper:#fff;--text:#222;--muted:#666;--accent:#2a6fdb;--bad:#d93025;--ok:#1e8e3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16171a;--panel:#26282d;--text:#e8e8e8;--muted:#9a9a9a;--accent:#6ea2f5}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16171a;--panel:#26282d;--text:#e8e8e8;--muted:#9a9a9a;--accent:#6ea2f5}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px 10px 28px}
h1{font-size:1.3rem;margin:4px 0 2px}
p.sub{margin:0 0 12px;color:var(--muted);font-size:.9rem;text-align:center;max-width:520px}
.hint{font-style:italic;color:var(--accent);margin-top:-6px}
#board{position:relative;width:min(100%,640px);aspect-ratio:8/7;background:var(--panel);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden}
.tile{position:absolute;width:12.5%;height:14.2857%;padding:.5%;transition:left .13s,top .13s;cursor:pointer}
.tile>div{position:relative;width:100%;height:100%;background:var(--paper);border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tile svg{width:100%;height:100%;display:block}
.tile.bad>div{box-shadow:inset 0 0 0 3px var(--bad)}
#hole{position:absolute;left:87.5%;top:85.7143%;width:12.5%;height:14.2857%;display:flex;align-items:center;justify-content:center;pointer-events:none}
#hole i{width:46%;aspect-ratio:1;border-radius:50%;border:2px dashed var(--muted);opacity:.6}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;margin:12px 0}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--muted);background:var(--panel);color:var(--text);cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
label{font-size:.9rem;display:flex;gap:6px;align-items:center}
#status{min-height:1.5em;font-weight:600;text-align:center}
#status.ok{color:var(--ok)}
</style>
</head>
<body>
<h1>I.Q. Puzzle</h1>
<p class="sub">Toca una ficha para deslizar toda la fila o columna hacia el hueco.<br>Objetivo: Dejar cada forma una sola vez por fila, columna y diagonal.</p>
<p class="sub hint">Ni la recta de la torre, ni la diagonal del alfil:<br>la armonía de este puzle galopa por otro carril.</p>
<div id="board"><div id="hole"><i></i></div></div>
<div class="bar">
  <button class="main" id="shuf">Desordenar</button>
  <button id="solve">Ver ejemplo</button>
  
  <label><input type="checkbox" id="conf" checked> Mostrar conflictos</label>
</div>
<div id="status"></div>
<div class="sub" id="moves">Movimientos: 0</div>
<script>
const R=7,C=8,INK="var(--ink)",PAPER="var(--paper)";
const sh=[
`<path d="M36 12h28v24h24v28H64v24H36V64H12V36h24z" fill="${INK}"/>`,
`<rect x="12" y="12" width="76" height="76" fill="${INK}"/>`,
`<polygon points="50,14 88,84 12,84" fill="none" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>`,
`<polygon points="14,12 14,88 88,88" fill="${INK}"/>`,
`<rect x="10" y="10" width="80" height="80" fill="${INK}"/><circle cx="50" cy="50" r="32" fill="${PAPER}"/>`,
`<polygon points="10,16 90,16 50,86" fill="${INK}"/>`,
`<rect x="10" y="10" width="80" height="80" fill="${INK}"/><polygon points="50,18 82,50 50,82 18,50" fill="${PAPER}"/>`];
const board=document.getElementById("board"),st=document.getElementById("status"),mv=document.getElementById("moves");
const shape=[],els=[];let g=[],moves=0,busy=false,playing=false;
const ROW1=[0,5,6,2,4,1,3];
for(let i=0;i<49;i++){shape[i]=ROW1[(3*Math.floor(i/7)+i%7)%7];
 const d=document.createElement("div");d.className="tile";
 d.innerHTML=`<div><svg viewBox="0 0 100 100">${sh[shape[i]]}</svg></div>`;
 d.onclick=()=>{if(!busy){const p=find(i);if(slide(p[0],p[1])){moves++;playing=true;refresh()}}};
 board.appendChild(d);els[i]=d}
const ok=(r,c)=>r>=0&&r<R&&c>=0&&c<C&&(c<7||r==6);
function solved(){g=[];for(let r=0;r<R;r++){g.push([]);for(let c=0;c<C;c++)g[r].push(c<7?r*7+c:null)}}
function find(id){for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(g[r][c]===id)return[r,c]}
function hole(){for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(ok(r,c)&&g[r][c]===null)return[r,c]}
function slide(r,c){const[hr,hc]=hole();if(r!=hr&&c!=hc||(r==hr&&c==hc))return false;
 if(r==hr){const s=Math.sign(hc-c);for(let k=hc;k!=c;k-=s)g[r][k]=g[r][k-s];}
 else{const s=Math.sign(hr-r);for(let k=hr;k!=r;k-=s)g[k][c]=g[k-s][c];}
 g[r][c]=null;return true}
function conflicts(){const bad=new Set(),dg=true;
 const lines=[];
 for(let i=0;i<7;i++){lines.push([...Array(7)].map((_,k)=>[i,k]));lines.push([...Array(7)].map((_,k)=>[k,i]))}
 if(dg){lines.push([...Array(7)].map((_,k)=>[k,k]));lines.push([...Array(7)].map((_,k)=>[k,6-k]))}
 for(const L of lines){const m={};for(const[r,c]of L){const t=g[r][c];if(t===null)continue;(m[shape[t]]=m[shape[t]]||[]).push(t)}
  for(const k in m)if(m[k].length>1)m[k].forEach(t=>bad.add(t))}
 return bad}
function refresh(){let bad=conflicts(),show=document.getElementById("conf").checked;
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const t=g[r][c];if(t===null||!ok(r,c))continue;
  const e=els[t];e.style.left=c*12.5+"%";e.style.top=r*100/7+"%";
  e.classList.toggle("bad",show&&bad.has(t)&&c<7)}
 const h=hole();const done=h[0]==6&&h[1]==7&&bad.size==0&&g.flat().filter(x=>x!==null).length==49;
 mv.textContent="Movimientos: "+moves;
 if(done&&playing){st.textContent="¡Resuelto en "+moves+" movimientos!";st.className="ok"}
 else{st.textContent=bad.size&&!busy?"Fichas en conflicto: "+bad.size:"";st.className=""}}
function shuffle(){if(busy)return;busy=true;playing=false;solved();let n=0,pend=3;
 const swapExtra=()=>{const a=g[6][7],b=g[6][6];if(a!==null&&b!==null&&shape[a]!==shape[b]){g[6][7]=b;g[6][6]=a;return true}return false};
 document.getElementById("shuf").disabled=true;
 const iv=setInterval(()=>{const h=hole();let opts=[];
  for(let k=0;k<C;k++)if(k!=h[1]&&ok(h[0],k)&&g[h[0]][k]!==null)opts.push([h[0],k]);
  for(let k=0;k<R;k++)if(k!=h[0]&&ok(k,h[1])&&g[k][h[1]]!==null)opts.push([k,h[1]]);
  const p=opts[Math.floor(Math.random()*opts.length)];slide(p[0],p[1]);
  if(n>=15&&pend>0&&Math.random()<0.2&&swapExtra())pend--;
  refresh();
  if(++n>=160&&(pend<3||n>500)){clearInterval(iv);busy=false;moves=0;playing=true;document.getElementById("shuf").disabled=false;refresh()}},22)}
document.getElementById("shuf").onclick=shuffle;
document.getElementById("solve").onclick=()=>{if(busy)return;solved();moves=0;playing=false;refresh()};
document.getElementById("conf").onchange=refresh;
const sty=document.createElement("style");sty.textContent=":root{--ink:#1c1c1c}";document.head.appendChild(sty);
solved();refresh();setTimeout(shuffle,400);
</script>
</body>
</html>
