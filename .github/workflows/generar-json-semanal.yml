name: Generar JSON Semanal

on:
  schedule:
    - cron: '0 0 * * 1'  # Lunes 00:00 UTC
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Ejecutar generador automático
        working-directory: ./py
        run: python generar_automatico.py
      
      - name: Commit y push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add json/
          git commit -m "chore: JSON automático $(date +'%Y-%m-%d %H:%M')" || true
          git push origin main
