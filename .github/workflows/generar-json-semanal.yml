name: Generar JSON Semanal

on:
  schedule:
    - cron: '0 0 * * 1'  # Lunes 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Ejecutar generador automático
        working-directory: ./py
        run: python generar_automatico.py
      
      - name: Commit y Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A json/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: JSON automático $(date +'%Y-%m-%d %H:%M')" && git push)
